<!DOCTYPE html>
<html>

<body>

</div>
<div class="travel-history">
  <div class="scan-event">
    <div class="scan-event__description">Delivered</div>
    <div class="scan-event__location">Springfield, IL</div>

  </div>
  <div class="scan-event">
    <div class="scan-event__description">On FedEx vehicle for delivery</div>
    <div class="scan-event__location">Springfield, IL</div>
    <div class="scan-event__date">January 15, 2025</div>
  </div>
  <div class="scan-event">
    <div class="scan-event__description">At local FedEx facility</div>
    <div class="scan-event__location">Springfield, IL</div>
    <div class="scan-event__date">January 14, 2025</div>
  </div>
</div>

</html>
