[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package-tracker-scraper"
version = "2.9.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "camoufox[geoip]==0.4.11",
    "playwright==1.58.0",
    "beautifulsoup4>=4.12",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["scraper"]
omit = ["scraper/tests/*"]

[tool.coverage.report]
show_missing = true
