<!DOCTYPE html>
<html>
<head><title>FedEx Tracking</title></head>
<body>
<div class="shipment-status-progress">
  <div class="status__title">In transit</div>
  <div class="delivery__date">January 16, 2025</div>
</div>
<div class="travel-history">
  <div class="scan-event">
    <div class="scan-event__description">Departed FedEx location</div>
    <div class="scan-event__location">Chicago, IL</div>
    <div class="scan-event__date">January 14, 2025</div>
  </div>
  <div class="scan-event">
    <div class="scan-event__description">Picked up</div>
    <div class="scan-event__location">New York, NY</div>
    <div class="scan-event__date">January 13, 2025</div>
  </div>
</div>
</body>
</html>
