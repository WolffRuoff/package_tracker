<!DOCTYPE html>
<html>
<head><title>USPS Tracking</title></head>
<body>
<div class="track-statusbar">
  <div class="current-tracking-status-wrapper">
    <div class="tracking-progress-bar-status-container">
      <div class="tb-status">Delivered</div>
    </div>
  </div>
</div>
<div class="expected-delivery-date">January 15, 2025</div>
<div class="track-bar-container">
  <div class="tb-step">
    <div class="tb-status-detail">Delivered, In/At Mailbox</div>
    <div class="tb-date">January 15, 2025</div>
    <div class="tb-location">Springfield, IL 62701</div>
  </div>
  <div class="tb-step">
    <div class="tb-status-detail">Out for Delivery</div>
    <div class="tb-date">January 15, 2025</div>
    <div class="tb-location">Springfield, IL 62701</div>
  </div>
  <div class="tb-step">
    <div class="tb-status-detail">In Transit to Next Facility</div>
    <div class="tb-date">January 14, 2025</div>
    <div class="tb-location">Chicago, IL 60601</div>
  </div>
</div>
</body>
</html>
