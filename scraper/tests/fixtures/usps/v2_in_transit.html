<!DOCTYPE html>
<html>
<head><title>USPS Tracking</title></head>
<body>
<div class="tracking-progress-bar-status-container in-transit-status">
  <div>
    <div class="upcoming-step"><p class="upcoming-status">Delivered</p></div>
    <div class="upcoming-step"><p class="upcoming-status">Out for Delivery</p></div>
    <div class="upcoming-step"><p class="upcoming-status">Preparing for Delivery</p></div>
    <div class="tb-step current-step">
      <span class="bar-fill-animation"></span>
      <p class="tb-status">On the Way</p>
      <p class="tb-status-detail">Arrived at USPS Facility</p>
      <p class="tb-location">ANAHEIM CA DISTRIBUTION CENTER</p>
      <p class="tb-date">July 8, 2026 9:49 AM</p>
    </div>
    <div class="tb-step">
      <div>
        <p class="tb-status-detail">Accepted at USPS Facility</p>
        <p class="tb-location">LAKE FOREST, CA 92630</p>
        <p class="tb-date">July 8, 2026 8:34 AM</p>
      </div>
    </div>
  </div>
</div>
<div class="expected_delivery">
  <h3>Expected Delivery by<span class="colon">:</span></h3>
  <h2>
    <span class="eta_wrap">
      <span class="eta_snip">
        <em class="day">Monday</em>
        <strong class="date"><span class="eta_snip">13</span></strong>
        <span class="month_year">
          <span>July</span> 2026
          <span role="button" class="hint"><i class="icon-tooltip"></i><span class="speech_bubble dd_bubble">tooltip text</span></span>
        </span>
      </span>
      <span class="eta_snip">
        <span class="descriptor">by<br/><strong class="time">9:00pm</strong></span>
      </span>
    </span>
  </h2>
</div>
</body>
</html>
