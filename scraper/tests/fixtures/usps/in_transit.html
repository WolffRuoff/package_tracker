<!DOCTYPE html>
<html>
<head><title>USPS Tracking</title></head>
<body>
<div class="track-statusbar">
  <div class="current-tracking-status-wrapper">
    <div class="tracking-progress-bar-status-container">
      <div class="tb-status">Moving Through Network</div>
    </div>
  </div>
</div>
<div class="expected_delivery">
  <h3>Expected Delivery by<span class="colon">:</span></h3>
  <h2>
    <span class="eta_wrap">
      <span class="eta_snip">
        <em class="day">Saturday</em>
        <strong class="date">7</strong>
        <span class="month_year">
          <span>March</span> 2026
          <span role="button" class="hint"><i class="icon-tooltip"></i><span class="speech_bubble">tooltip text</span></span>
        </span>
      </span>
    </span>
  </h2>
</div>
<div class="track-bar-container">
  <div class="tb-step">
    <div class="tb-status-detail">In Transit to Next Facility</div>
    <div class="tb-date">January 14, 2025</div>
    <div class="tb-location">Chicago, IL 60601</div>
  </div>
  <div class="tb-step">
    <div class="tb-status-detail">Accepted at USPS Origin Facility</div>
    <div class="tb-date">January 13, 2025</div>
    <div class="tb-location">New York, NY 10001</div>
  </div>
</div>
</body>
</html>
