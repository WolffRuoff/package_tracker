name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/ --cov=custom_components/package_tracker --cov-report=term --cov-report=xml
      - name: Generate coverage badge
        run: uv run genbadge coverage -i coverage.xml -o coverage.svg
      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend-src && npm ci && npm run build
      - name: Upload built card
        uses: actions/upload-artifact@v4
        with:
          name: frontend-card
          path: custom_components/package_tracker/frontend/package-tracker-card.js

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [validate-hacs, test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if skip release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          if [[ "$COMMIT_MSG" == chore:\ bump\ version\ to\ * ]] && [[ "$COMMIT_AUTHOR" == "github-actions[bot]" ]]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            echo "Skipping release — this is a version-bump commit from the bot."
          fi

      - name: Download coverage badge
        if: env.SKIP_RELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: .

      - name: Download built frontend card
        if: env.SKIP_RELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-card
          path: custom_components/package_tracker/frontend

      - name: Get latest tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing v* tag found. Reading version from manifest.json..."
            VERSION=$(python3 -c "import json; print(json.load(open('custom_components/package_tracker/manifest.json'))['version'])")
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            git tag "v${VERSION}" "$FIRST_COMMIT"
            LATEST_TAG="v${VERSION}"
            echo "Created tag $LATEST_TAG on first commit."
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
          echo "Latest tag: $LATEST_TAG"

      - name: Check for new commits
        if: env.SKIP_RELEASE != 'true'
        run: |
          COMMIT_COUNT=$(git rev-list "$LATEST_TAG"..HEAD --count --no-merges)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            echo "No new commits since $LATEST_TAG. Skipping release."
          else
            echo "$COMMIT_COUNT new commit(s) since $LATEST_TAG."
          fi

      - name: Determine version bump
        if: env.SKIP_RELEASE != 'true'
        run: |
          COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty="%s%n%b" --no-merges)

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE 'BREAKING CHANGE:|^[a-z]+(\(.+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          echo "BUMP=$BUMP" >> "$GITHUB_ENV"
          echo "Bump type: $BUMP"

      - name: Calculate new version
        if: env.SKIP_RELEASE != 'true'
        run: |
          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "New version: $NEW_VERSION (was $CURRENT)"

      - name: Set up uv
        if: env.SKIP_RELEASE != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Update version files
        if: env.SKIP_RELEASE != 'true'
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('custom_components/package_tracker/manifest.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ env.NEW_VERSION }}'
          p.write_text(json.dumps(data, indent=2) + '\n')
          "
          sed -i 's/^version = ".*"/version = "${{ env.NEW_VERSION }}"/' scraper/pyproject.toml
          uv lock --project scraper
          echo "Updated manifest.json, scraper/pyproject.toml, and scraper/uv.lock to $NEW_VERSION"

      - name: Commit, tag, and push
        if: env.SKIP_RELEASE != 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://oauth2:${REPO_PAT}@github.com/${{ github.repository }}
          git add -f coverage.svg custom_components/package_tracker/frontend/package-tracker-card.js
          git add custom_components/package_tracker/manifest.json scraper/pyproject.toml scraper/uv.lock
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD --tags

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$NEW_VERSION" \
            --generate-notes \
            --notes-start-tag "$LATEST_TAG"

      - name: Set up Docker Buildx
        if: env.SKIP_RELEASE != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.SKIP_RELEASE != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: env.SKIP_RELEASE != 'true'
        uses: docker/build-push-action@v6
        with:
          context: scraper
          push: true
          tags: |
            wolffruoff/package-tracker-scraper:latest
            wolffruoff/package-tracker-scraper:${{ env.NEW_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
