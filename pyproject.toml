[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package-tracker"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "homeassistant",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "genbadge[coverage]>=1.1",
    "aiohttp",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["custom_components"]

[tool.coverage.run]
source = ["custom_components/package_tracker"]
omit = ["custom_components/package_tracker/frontend/*"]

[tool.coverage.report]
show_missing = true
