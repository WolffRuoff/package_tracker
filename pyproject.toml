[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package-tracker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "homeassistant",
    "aiohttp",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["custom_components"]

[tool.coverage.run]
source = ["custom_components/package_tracker"]
omit = ["custom_components/package_tracker/frontend/*"]

[tool.coverage.report]
show_missing = true
